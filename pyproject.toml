[project]
name = "neural-painter"
version = "0.1.0"
description = "Research prototype for reference-conditioned persistent stroke-space neural painting"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "scikit-image",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "torch",
]

[tool.setuptools]
packages = ["painter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
